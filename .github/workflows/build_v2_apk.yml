name: Build V2 UV Sensor APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile_app

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK (V2 Target)
        run: flutter build apk --release -t lib/uv_dashboard_v2.dart

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-UV-Cloud-Hub-V2-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
